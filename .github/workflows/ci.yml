name: CI
on:
  push:
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - Cargo.lock
      - rust-toolchain.toml
      - .cargo/**
      - crates/**
      - fixtures/**
      - benchmarks/**
      - xtask/**
      - apps/docs/**
      - .github/workflows/ci.yml
  pull_request:
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - Cargo.lock
      - rust-toolchain.toml
      - .cargo/**
      - crates/**
      - fixtures/**
      - benchmarks/**
      - xtask/**
      - apps/docs/**
      - .github/workflows/ci.yml
  workflow_dispatch:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test native workspace and frozen behavior corpus
        run: cargo test --workspace --locked
      - name: Test dependency-light core
        run: cargo test -p differens-core --no-default-features --locked
      - name: Test adapters without native grammars
        run: cargo test -p differens-tiers --no-default-features --locked
      - name: API and static documentation
        run: |
          cargo doc --workspace --no-deps --locked
          cargo xtask docs

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Install coverage tool
        run: cargo install cargo-llvm-cov --version 0.9.1 --locked
      - name: Check line and function coverage
        run: cargo xtask coverage

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install minimum supported Rust
        run: rustup toolchain install 1.85.1 --profile minimal
      - name: Check workspace on minimum supported Rust
        run: cargo +1.85.1 check --workspace --locked

  archives:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Build native archive
        run: cargo xtask package
      - uses: actions/upload-artifact@v4
        with:
          name: differens-${{ runner.os }}-${{ runner.arch }}
          path: target/packages/*
