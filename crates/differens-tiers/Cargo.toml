[package]
name = "differens-tiers"
version.workspace = true
description = "Code, data, markup, prose, and byte adapters for Differens"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[dependencies]
differens-core.workspace = true
differens-grammar-swift = { path = "../differens-grammar-swift", version = "0.3.0", optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tree-sitter = { workspace = true, optional = true }
tree-sitter-language = { workspace = true, optional = true }
yaml-rust2.workspace = true
toml_edit = { version = "0.22.27", default-features = false, features = ["parse"] }
json5.workspace = true
# Enforce native stack guards in JSON5 parsing, including unlocked library consumers.
pest = "2.9.4"

[dev-dependencies]
toml = { workspace = true, features = ["preserve_order"] }

[build-dependencies]
cc.workspace = true
flate2 = "1.1"
tar = "0.4"

[features]
default = ["code"]
code = ["dep:tree-sitter", "dep:tree-sitter-language", "dep:differens-grammar-swift"]

[lints]
workspace = true
