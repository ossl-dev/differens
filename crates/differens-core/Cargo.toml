[package]
name = "differens-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Arena-backed semantic tree matching and edit scripts for Differens"
# Frozen oracle inputs live at the workspace root, outside published crates.
exclude = ["tests/parity.rs"]

[features]
default = ["serde"]
serde = ["dep:serde", "dep:serde_json"]

[dependencies]
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true, features = ["raw_value"] }
thiserror.workspace = true

[lints]
workspace = true
